# One nginx, four HTTPS listeners, each with a different certificate.
server {
    listen 8441 ssl;
    server_name ok.demo.local;
    ssl_certificate     /certs/ok.crt;
    ssl_certificate_key /certs/ok.key;
    location / { return 200 "ok\n"; }
}
server {
    listen 8442 ssl;
    server_name warning.demo.local;
    ssl_certificate     /certs/warning.crt;
    ssl_certificate_key /certs/warning.key;
    location / { return 200 "warning\n"; }
}
server {
    listen 8443 ssl;
    server_name critical.demo.local;
    ssl_certificate     /certs/critical.crt;
    ssl_certificate_key /certs/critical.key;
    location / { return 200 "critical\n"; }
}
server {
    listen 8444 ssl;
    server_name expired.demo.local;
    ssl_certificate     /certs/expired.crt;
    ssl_certificate_key /certs/expired.key;
    location / { return 200 "expired\n"; }
}
